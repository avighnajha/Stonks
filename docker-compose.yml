x-backend: &backend
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:'+process.env.PORT+'/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

x-env: &env
  DATABASE_URL: postgresql://user:${POSTGRES_PASSWORD:-password}@postgres_db:5432/stonks_main_db
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
  USER_SERVICE_URL: http://user_service:3001
  WALLET_SERVICE_URL: http://wallet_service:3002
  MARKETPLACE_SERVICE_URL: http://marketplace_service:3003
  TRADING_SERVICE_URL: http://trading_service:3004
  PORTFOLIO_SERVICE_URL: http://portfolio_service:3005
  REDIS_URL: redis://redis:6379

services:
  postgres_db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: stonks_main_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d stonks_main_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  trading_service:
    <<: *backend
    build: ./services/trading_service
    environment:
      <<: *env
      PORT: 3004
    depends_on:
      postgres_db: { condition: service_healthy }

  user_service:
    <<: *backend
    build: ./services/user_service
    environment:
      <<: *env
      PORT: 3001
    depends_on:
      trading_service: { condition: service_healthy }

  wallet_service:
    <<: *backend
    build: ./services/wallet_service
    environment:
      <<: *env
      PORT: 3002
    depends_on:
      trading_service: { condition: service_healthy }

  portfolio_service:
    <<: *backend
    build: ./services/portfolio_service
    environment:
      <<: *env
      PORT: 3005
    depends_on:
      trading_service: { condition: service_healthy }

  marketplace_service:
    <<: *backend
    build: ./services/marketplace_service
    environment:
      <<: *env
      PORT: 3003
    depends_on:
      trading_service: { condition: service_healthy }

  api_gateway:
    <<: *backend
    build: ./services/api_gateway
    ports: ["127.0.0.1:8080:8080"]
    environment:
      <<: *env
      PORT: 8080
    depends_on:
      user_service: { condition: service_healthy }
      wallet_service: { condition: service_healthy }
      portfolio_service: { condition: service_healthy }
      marketplace_service: { condition: service_healthy }

volumes:
  postgres_data:
  redis_data:
